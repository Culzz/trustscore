# Local, one-command stack: API on :8000, web on :3000.
#
#   docker compose up --build
#
# The API logs predictions to a local SQLite file (no cloud account needed).
services:
  api:
    build:
      context: ./api
    ports:
      - "8000:8000"
    environment:
      STORAGE_BACKEND: sqlite
      SQLITE_PATH: /data/predictions.db
      LOG_PREDICTIONS: "true"
      ENABLE_DOCS: "true"
      CORS_ORIGINS: "http://localhost:3000"
    volumes:
      - trustscore_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - api

volumes:
  trustscore_data:
